name: TL1 CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  environment-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify development tools
        run: |
          python --version
          node --version
          npm --version
          git --version

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check JavaScript syntax when project files exist
        run: |
          if [ -f package.json ]; then
            npm install
            if npm run | grep -q " lint"; then npm run lint; fi
          else
            echo "No Node.js project exists yet; environment check completed."
          fi
